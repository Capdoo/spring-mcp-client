spring.application.name=spring-mcp-client
spring.main.banner-mode=off

# ---------------------------------------------------------------- MCP
# Comando para lanzar el MCP Server (separado por comas). El cliente lo arranca como
# proceso hijo y habla con él por stdin/stdout (transporte STDIO).
# Provisional: servidor Node en Docker (ver mcp-server-node/). -i es obligatorio (stdin abierto).
mcp.server.command=docker,run,-i,--rm,basic-user-mcp-server
# Futuro: MCP Server propio en Spring Boot
#mcp.server.command=java,-jar,../basic-user-mcp-server/target/basic-user-mcp-server.jar

# Identidad enviada en "initialize" (clientInfo)
mcp.client.name=basic-mcp-client
mcp.client.version=1.0.0

# Tiempo maximo de espera por cada respuesta del servidor
mcp.request-timeout=30s

# Consola interactiva (los tests la desactivan)
mcp.console.enabled=true

# ---------------------------------------------------------------- Logging
logging.level.root=WARN
logging.level.com.rafaelnontol.mcpclient=INFO
logging.level.com.rafaelnontol.mcpclient.McpClientApplication=WARN
# Cambia a DEBUG para ver cada mensaje JSON-RPC enviado (-->) y recibido (<--).
# Ojo: en DEBUG se imprimen los payloads completos, incluidos los argumentos de las Tools.
#logging.level.com.rafaelnontol.mcpclient=DEBUG
logging.pattern.console=%clr(%-5level) %clr(%logger{0}){cyan} - %msg%n
